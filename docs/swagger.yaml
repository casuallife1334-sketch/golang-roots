basePath: /api/v1
definitions:
  genealogy-tree_internal_core_domain.Gender:
    enum:
    - male
    - female
    - other
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
    - GenderOther
  genealogy-tree_internal_core_domain.PatchPersonInput:
    properties:
      birth_date:
        type: string
      death_date:
        type: string
      first_name:
        type: string
      gender:
        $ref: '#/definitions/genealogy-tree_internal_core_domain.Gender'
      last_name:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      patronymic:
        type: string
        x-nullable: true
      photo_url:
        type: string
    type: object
  genealogy-tree_internal_core_domain.RelationshipDirection:
    enum:
    - parent
    - child
    type: string
    x-enum-varnames:
    - DirectionParent
    - DirectionChild
  genealogy-tree_internal_core_domain.RelationshipType:
    enum:
    - parent_child
    - spouse
    type: string
    x-enum-varnames:
    - RelationshipParentChild
    - RelationshipSpouse
  genealogy-tree_internal_core_domain.TreeRole:
    enum:
    - owner
    - editor
    - viewer
    type: string
    x-enum-varnames:
    - TreeRoleOwner
    - TreeRoleEditor
    - TreeRoleViewer
  genealogy-tree_internal_core_transport_http_response.ErrorResponse:
    properties:
      error:
        example: full error text
        type: string
      message:
        example: short human-readable message
        type: string
    type: object
  internal_features_auth_transport_http.LoginRequest:
    properties:
      email:
        example: ivan@example.com
        type: string
      password:
        example: strong-password
        type: string
    type: object
  internal_features_auth_transport_http.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 900
        type: integer
      token_type:
        example: Bearer
        type: string
    type: object
  internal_features_auth_transport_http.RegisterRequest:
    properties:
      email:
        example: ivan@example.com
        type: string
      password:
        example: strong-password
        type: string
    type: object
  internal_features_auth_transport_http.RegisterResponse:
    properties:
      created_at:
        example: "2026-02-26T10:30:00Z"
        type: string
      email:
        example: ivan@example.com
        type: string
      id:
        example: 01JQ2Q4K7Y8F6M2Z3N4P5R6S7T
        type: string
      updated_at:
        example: "2026-02-26T10:30:00Z"
        type: string
    type: object
  internal_features_persons_transport_http.CreatePersonRequest:
    properties:
      birth_date:
        example: "1980-01-02T00:00:00Z"
        type: string
      death_date:
        example: "2024-05-10T00:00:00Z"
        type: string
      first_name:
        example: Ivan
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/genealogy-tree_internal_core_domain.Gender'
        example: male
      last_name:
        example: Petrov
        type: string
      metadata:
        $ref: '#/definitions/internal_features_persons_transport_http.MetadataExample'
      patronymic:
        example: Petrovich
        type: string
        x-nullable: true
      photo_url:
        example: persons/01JQ2Q4K7Y8F6M2Z3N4P5R6S7T/photo
        type: string
    type: object
  internal_features_persons_transport_http.MetadataExample:
    properties:
      city:
        example: Moscow
        type: string
      occupation:
        example: Engineer
        type: string
    type: object
  internal_features_persons_transport_http.PersonResponse:
    properties:
      birth_date:
        example: "1980-01-02T00:00:00Z"
        type: string
      created_at:
        example: "2026-02-26T10:30:00Z"
        type: string
      death_date:
        example: "2024-05-10T00:00:00Z"
        type: string
      first_name:
        example: Ivan
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/genealogy-tree_internal_core_domain.Gender'
        example: male
      id:
        example: 01JQ2Q4K7Y8F6M2Z3N4P5R6S7T
        type: string
      last_name:
        example: Petrov
        type: string
      metadata:
        $ref: '#/definitions/internal_features_persons_transport_http.MetadataExample'
      patronymic:
        example: Petrovich
        type: string
        x-nullable: true
      photo_url:
        example: persons/01JQ2Q4K7Y8F6M2Z3N4P5R6S7T/photo
        type: string
      updated_at:
        example: "2026-02-26T10:30:00Z"
        type: string
    type: object
  internal_features_relationships_transport_http.CreateRelationshipRequest:
    properties:
      direction:
        allOf:
        - $ref: '#/definitions/genealogy-tree_internal_core_domain.RelationshipDirection'
        example: parent
      metadata:
        type: object
      person1_id:
        example: 01JQ2Q4K7Y8F6M2Z3N4P5R6S7T
        type: string
      person2_id:
        example: 01JQ2Q4K8Z8F6M2Z3N4P5R6S7U
        type: string
      type:
        allOf:
        - $ref: '#/definitions/genealogy-tree_internal_core_domain.RelationshipType'
        example: parent_child
    type: object
  internal_features_relationships_transport_http.PatchRelationshipRequest:
    properties:
      metadata:
        type: object
    type: object
  internal_features_relationships_transport_http.RelationshipResponse:
    properties:
      created_at:
        example: "2026-02-26T10:30:00Z"
        type: string
      direction:
        allOf:
        - $ref: '#/definitions/genealogy-tree_internal_core_domain.RelationshipDirection'
        example: parent
      id:
        example: 01JQ2Q4K9Y8F6M2Z3N4P5R6S7V
        type: string
      metadata:
        type: object
      person1_id:
        example: 01JQ2Q4K7Y8F6M2Z3N4P5R6S7T
        type: string
      person2_id:
        example: 01JQ2Q4K8Z8F6M2Z3N4P5R6S7U
        type: string
      type:
        allOf:
        - $ref: '#/definitions/genealogy-tree_internal_core_domain.RelationshipType'
        example: parent_child
      updated_at:
        example: "2026-02-26T10:35:00Z"
        type: string
        x-nullable: true
    type: object
  internal_features_trees_transport_http.CreateTreeRequest:
    properties:
      name:
        example: Family Petrov
        type: string
    type: object
  internal_features_trees_transport_http.PatchTreeRequest:
    properties:
      name:
        example: Family Petrov Updated
        type: string
    type: object
  internal_features_trees_transport_http.TreeResponse:
    properties:
      created_at:
        example: "2026-02-26T10:30:00Z"
        type: string
      id:
        example: 01JQ2Q4K7Y8F6M2Z3N4P5R6S7T
        type: string
      name:
        example: Family Petrov
        type: string
      owner_id:
        example: 01JQ2Q4K8Z8F6M2Z3N4P5R6S7U
        type: string
      role:
        allOf:
        - $ref: '#/definitions/genealogy-tree_internal_core_domain.TreeRole'
        example: owner
      updated_at:
        example: "2026-02-26T10:30:00Z"
        type: string
    type: object
  internal_features_users_transport_http.UserResponse:
    properties:
      created_at:
        example: "2026-02-26T10:30:00Z"
        type: string
      email:
        example: ivan@example.com
        type: string
      id:
        example: 01JQ2Q4K7Y8F6M2Z3N4P5R6S7T
        type: string
      updated_at:
        example: "2026-02-26T10:30:00Z"
        type: string
    type: object
host: 127.0.0.1:8080
info:
  contact: {}
  description: Genealogy Tree REST API
  title: Genealogy Tree API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверка email и пароля с выдачей access JWT
      parameters:
      - description: Login тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный вход
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      summary: Вход пользователя
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создание нового аккаунта пользователя
      parameters:
      - description: Register тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешная регистрация
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Email already exists
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /trees:
    get:
      description: Получение деревьев, доступных текущему пользователю
      produces:
      - application/json
      responses:
        "200":
          description: Список деревьев
          schema:
            items:
              $ref: '#/definitions/internal_features_trees_transport_http.TreeResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список деревьев
      tags:
      - trees
    post:
      consumes:
      - application/json
      description: Создание дерева с автоматическим назначением текущего пользователя
        владельцем
      parameters:
      - description: CreateTree тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_trees_transport_http.CreateTreeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданное дерево
          schema:
            $ref: '#/definitions/internal_features_trees_transport_http.TreeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание дерева
      tags:
      - trees
  /trees/{tree_id}:
    delete:
      description: Удаление дерева владельцем вместе с его участниками и связанными
        данными
      parameters:
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      responses:
        "204":
          description: Дерево удалено
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Tree not found
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление дерева
      tags:
      - trees
    get:
      description: Получение доступного пользователю дерева
      parameters:
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Дерево
          schema:
            $ref: '#/definitions/internal_features_trees_transport_http.TreeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Tree not found
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение дерева
      tags:
      - trees
    patch:
      consumes:
      - application/json
      description: Изменение названия дерева владельцем
      parameters:
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      - description: PatchTree тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_trees_transport_http.PatchTreeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Изменённое дерево
          schema:
            $ref: '#/definitions/internal_features_trees_transport_http.TreeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Tree not found
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Изменение дерева
      tags:
      - trees
  /trees/{tree_id}/persons:
    get:
      description: Получение списка людей в генеалогическом дереве
      parameters:
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка людей
          schema:
            items:
              $ref: '#/definitions/internal_features_persons_transport_http.PersonResponse'
            type: array
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список людей
      tags:
      - persons
    post:
      consumes:
      - application/json
      description: Создание нового человека в генеалогическом дереве
      parameters:
      - description: CreatePerson тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_persons_transport_http.CreatePersonRequest'
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданный человек
          schema:
            $ref: '#/definitions/internal_features_persons_transport_http.PersonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание человека
      tags:
      - persons
  /trees/{tree_id}/persons/{id}:
    delete:
      description: Удаление человека и связанных с ним relationships
      parameters:
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      - description: ULID удаляемого человека
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Успешное удаление человека
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Person not found
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление человека
      tags:
      - persons
    get:
      description: Получение конкретного человека по ULID
      parameters:
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      - description: ULID получаемого человека
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Человек успешно найден
          schema:
            $ref: '#/definitions/internal_features_persons_transport_http.PersonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Person not found
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение человека
      tags:
      - persons
    patch:
      consumes:
      - application/json
      description: Изменение информации о существующем человеке
      parameters:
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      - description: ULID изменяемого человека
        in: path
        name: id
        required: true
        type: string
      - description: PatchPerson тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/genealogy-tree_internal_core_domain.PatchPersonInput'
      produces:
      - application/json
      responses:
        "200":
          description: Успешно изменённый человек
          schema:
            $ref: '#/definitions/internal_features_persons_transport_http.PersonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Person not found
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Изменение человека
      tags:
      - persons
  /trees/{tree_id}/persons/{id}/photo:
    delete:
      description: Удаление фотографии человека из хранилища
      parameters:
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      - description: ULID человека
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Фотография успешно удалена
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Person not found
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление фотографии человека
      tags:
      - persons
    get:
      description: Получение бинарного содержимого фотографии человека
      parameters:
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      - description: ULID человека
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Фотография человека
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Person photo not found
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение фотографии человека
      tags:
      - persons
    post:
      consumes:
      - multipart/form-data
      description: Загрузка или замена фотографии человека, максимальный размер 10
        MB
      parameters:
      - description: ULID дерева
        in: path
        name: tree_id
        required: true
        type: string
      - description: ULID человека
        in: path
        name: id
        required: true
        type: string
      - description: Фотография человека
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Фотография успешно загружена
          schema:
            $ref: '#/definitions/internal_features_persons_transport_http.PersonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Person not found
          schema:
            $ref: '#/definitions/genealogy-tree_internal_core_transport_http_response.ErrorResponse'
        "500":
